<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weather Dashboard</title>
<style>
:root{
  --bg:#e9f1f7; --surface:#fff; --ink:#12263a; --muted:#52667a; --line:#c6d6e3; --accent:#1769e0; --warn:#fff3cd; --warn-ink:#5c4400;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1a26;--surface:#162434;--ink:#e6eef6;--muted:#9bb0c4;--line:#2a3e53;--accent:#6aa5ff;--warn:#3a2f10;--warn-ink:#f0d68a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1a26;--surface:#162434;--ink:#e6eef6;--muted:#9bb0c4;--line:#2a3e53;--accent:#6aa5ff;--warn:#3a2f10;--warn-ink:#f0d68a}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:34rem;margin:0 auto;padding:1.25rem}
h1{font-family:Georgia,serif;margin:.25rem 0 1rem;font-size:1.8rem}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:.3rem}
select{width:100%;padding:.7rem;font-size:1rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.25rem;margin-top:1rem}
.now{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
.temp{font-family:Georgia,serif;font-size:3.5rem;line-height:1}
.cond{font-size:1.2rem}
.meta{display:flex;gap:1.5rem;color:var(--muted);margin-top:.75rem;font-size:.95rem}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;text-align:center;font-size:.9rem}
.days div{padding:.5rem .1rem;border-radius:8px;background:var(--bg)}
.days b{display:block}
.days span{color:var(--muted);display:block;font-size:.8rem}
.note{background:var(--warn);color:var(--warn-ink);border-radius:8px;padding:.6rem .8rem;font-size:.85rem;margin-top:1rem}
.status{color:var(--muted);margin-top:1rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">
  <h1>Weather dashboard</h1>
  <label for="city">City</label>
  <select id="city">
    <option value="-1.2921,36.8219">Nairobi</option>
    <option value="-4.0435,39.6682">Mombasa</option>
    <option value="-0.0917,34.7680">Kisumu</option>
    <option value="51.5072,-0.1276">London</option>
    <option value="40.7128,-74.0060">New York</option>
  </select>

  <p class="status" id="status" role="status">Loading forecast…</p>
  <div id="out" hidden>
    <div class="card">
      <div class="now"><span class="temp" id="temp"></span><span class="cond" id="cond"></span></div>
      <div class="meta"><span id="hum"></span><span id="wind"></span></div>
    </div>
    <div class="card"><div class="days" id="days"></div></div>
  </div>
  <div class="note" id="note" hidden></div>
</main>

<script>
// Live data comes from Open-Meteo (free, no API key).
// If the request is blocked (for example inside a preview), sample data is shown instead.
var SAMPLE = {
  current:{temperature_2m:23,relative_humidity_2m:62,wind_speed_10m:11,weather_code:2},
  daily:{time:["2026-01-01","2026-01-02","2026-01-03","2026-01-04","2026-01-05"],
    weather_code:[2,3,61,1,0],temperature_2m_max:[25,24,22,26,27],temperature_2m_min:[14,15,15,14,13]}
};
function describe(c){
  if(c===0) return "Clear sky";
  if(c<=3) return "Partly cloudy";
  if(c===45||c===48) return "Fog";
  if(c>=51&&c<=67) return "Rain";
  if(c>=71&&c<=77) return "Snow";
  if(c>=80&&c<=82) return "Showers";
  if(c>=95) return "Thunderstorm";
  return "Cloudy";
}
function el(id){return document.getElementById(id)}
function render(d, isSample){
  el("temp").textContent = Math.round(d.current.temperature_2m) + "°C";
  el("cond").textContent = describe(d.current.weather_code);
  el("hum").textContent = "Humidity " + d.current.relative_humidity_2m + "%";
  el("wind").textContent = "Wind " + Math.round(d.current.wind_speed_10m) + " km/h";
  var box = el("days"); box.textContent = "";
  d.daily.time.forEach(function(t,i){
    var cell = document.createElement("div");
    var day = document.createElement("b");
    day.textContent = isSample ? "Day " + (i+1) : new Date(t+"T12:00:00").toLocaleDateString([], {weekday:"short"});
    var hi = document.createElement("span"); hi.textContent = Math.round(d.daily.temperature_2m_max[i]) + "° / " + Math.round(d.daily.temperature_2m_min[i]) + "°";
    var w = document.createElement("span"); w.textContent = describe(d.daily.weather_code[i]);
    cell.append(day, hi, w); box.appendChild(cell);
  });
  el("out").hidden = false; el("status").hidden = true;
  var note = el("note");
  note.hidden = !isSample;
  note.textContent = isSample ? "Showing sample data. Live forecasts load when this page runs on your own site (Netlify, Vercel, GitHub Pages)." : "";
}
function load(){
  var p = el("city").value.split(",");
  el("status").hidden = false; el("status").textContent = "Loading forecast…"; el("out").hidden = true;
  var url = "https://api.open-meteo.com/v1/forecast?latitude="+p[0]+"&longitude="+p[1]+
    "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5";
  fetch(url).then(function(r){
    if(!r.ok) throw new Error("Bad response");
    return r.json();
  }).then(function(d){ render(d,false) })
  .catch(function(){ render(SAMPLE,true) });
}
el("city").addEventListener("change", load);
load();
</script>
</body>
</html>
